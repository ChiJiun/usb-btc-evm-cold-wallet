image efi-part.vfat {
	vfat {
		label = "USBCOLD_EFI"
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image cold-vault.vfat {
	vfat {
		label = "COLD_VAULT"
	}
	size = 64M
}

image usb-cold-wallet.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition vault {
		image = "cold-vault.vfat"
	}
}
