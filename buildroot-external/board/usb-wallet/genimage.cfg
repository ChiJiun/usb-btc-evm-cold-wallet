image efi-part.vfat {
	vfat {
		label = "USBCOLD_EFI"
		extraargs = "--invariant"
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image cold-vault.vfat {
	empty = true
	vfat {
		label = "COLD_VAULT"
		extraargs = "--invariant"
	}
	size = 64M
}

image tx-transfer.vfat {
	vfat {
		label = "TX_TRANSFER"
		extraargs = "--invariant"
		file COMPANION {
			image = "transfer-part/COMPANION"
		}
		file TRANSACTIONS {
			image = "transfer-part/TRANSACTIONS"
		}
	}
	size = 512M
}

image usb-cold-wallet.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "f1448aa1-28cc-54bf-8fdd-3008514c0ab5"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = "e2bd6d1b-8de5-502d-a897-c53a8e60f46b"
		offset = 1M
		bootable = true
		read-only = true
	}

	# Linux filesystem type keeps the app-level encrypted vault out of normal
	# Windows Explorer automount. A hostile/admin Windows host can still raw-write
	# a normal USB device; this is isolation, not a hardware write-protection claim.
	partition vault {
		image = "cold-vault.vfat"
		partition-type-uuid = L
		partition-uuid = "18f1c36f-d5c0-5052-9cd2-03e9c2a48f00"
	}

	# The sole Windows-visible data partition. Portable Companion lives below
	# COMPANION/; transaction requests/responses live below TRANSACTIONS/.
	partition transfer {
		image = "tx-transfer.vfat"
		partition-type-uuid = F
		partition-uuid = "42f6f5d4-9310-5ac3-b5d4-1540cbe7d6b4"
	}
}
