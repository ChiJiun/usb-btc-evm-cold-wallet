image efi-part.vfat {
	vfat {
		label = "USBCOLD_EFI"
		extraargs = "--invariant"
		file EFI {
			image = "efi-part/EFI"
		}
		file bzImage {
			image = "bzImage"
		}
	}
	size = 64M
}

image cold-vault.vfat {
	# The vault starts genuinely empty; without this genimage tries mcopy root/*
	# and fails because its isolated rootpath contains no files.
	empty = true
	vfat {
		label = "COLD_VAULT"
		extraargs = "--invariant"
	}
	size = 64M
}

image usb-cold-wallet.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "f1448aa1-28cc-54bf-8fdd-3008514c0ab5"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		partition-uuid = "e2bd6d1b-8de5-502d-a897-c53a8e60f46b"
		offset = 1M
		bootable = true
		read-only = true
	}

	partition vault {
		image = "cold-vault.vfat"
		partition-type-uuid = F
		partition-uuid = "18f1c36f-d5c0-5052-9cd2-03e9c2a48f00"
	}
}
