set default="0"
set timeout="2"

menuentry "USB BTC+EVM Cold Wallet (TESTNET ONLY)" {
    # Serial captures kernel startup failures in UEFI CI; tty1 remains the
    # primary interactive console on physical offline hardware.
    linux /bzImage console=ttyS0,115200 console=tty1 loglevel=3 rdinit=/sbin/init
}
