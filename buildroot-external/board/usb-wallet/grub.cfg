set default="0"
set timeout="2"

menuentry "USB BTC+EVM Cold Wallet (TESTNET ONLY)" {
    # Keep tty1 available for the physical screen, but make ttyS0 the
    # primary /dev/console for deterministic CI boot diagnostics.
    # earlyprintk also exposes failures before the normal console starts.
    linux /bzImage console=tty1 console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 loglevel=7 rdinit=/sbin/init
}
