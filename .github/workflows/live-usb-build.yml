name: Live USB image verification

on:
  workflow_call:
    inputs:
      smoke_only:
        type: boolean
        required: false
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede only obsolete pull-request runs. main/manual validations use a
  # unique run id so a later merge can never cancel an earlier main gate and
  # turn CI / Required into a false (fail-closed) failure.
  group: live-usb-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.smoke_only && 'smoke' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-smoke:
    if: inputs.smoke_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify real reusable workflow invocation
        run: |
          set -euo pipefail
          test "${{ inputs.smoke_only }}" = "true"
          echo "Live USB reusable workflow_call contract executed"

  clean-builds:
    # Both complete Buildroot builds run on separate clean GitHub-hosted runners.
    # Independent source/build outputs are NOT cached. Matrix builds execute
    # concurrently, reducing wall-clock latency without reducing coverage.
    # Draft and Ready PRs run the SAME dual build: in parallel it costs no
    # extra wall-clock, and Required success always means full verification
    # of that exact SHA (no re-run when a draft is marked Ready).
    # Either build failing already fails the gate, so cancel its twin early.
    if: inputs.smoke_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        run: [1, 2]
    env:
      DEBIAN_FRONTEND: noninteractive
      BR2_JLEVEL: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Test and publish bytes from the PR's exact HEAD, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          printf 'Exact checkout: %s\n' "$actual"

      - name: Show resource budget
        run: |
          uname -m
          nproc
          free -h
          df -h .

      - name: Install build-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make gcc g++ patch rsync perl tar cpio file bc gawk gzip \
            bzip2 xz-utils python3 python3-venv python3-pip curl wget gnupg \
            coreutils findutils diffutils unzip ca-certificates qemu-system-x86 ovmf

      - name: Verify host prerequisites
        run: |
          sh scripts/check_host.sh
          df -h .

      # Only download inputs are cached. Never cache build/output, compilers,
      # rootfs, image files or verification evidence: the two clean builds
      # must still compile independently on every relevant HEAD.
      # Restore is untrusted input: Buildroot enforces source hashes and the
      # fetch scripts verify Buildroot's signed release and every wheel hash.
      - name: Restore verified source downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: |
            build/dl
            build/cache
            build/wheelhouse
          key: live-usb-downloads-v1-${{ runner.os }}-${{ hashFiles('infra/buildroot.env', 'infra/buildroot-release-key.asc', 'infra/embit.env', 'infra/wheelhouse.sha256', 'infra/wheelhouse-requirements.txt', 'buildroot-external/configs/usb_wallet_x86_64_defconfig', 'buildroot-external/package/**', 'scripts/fetch_buildroot.sh', 'scripts/fetch_wheelhouse.sh', 'scripts/fetch_sources.sh') }}

      - name: Prepare authenticated offline sources
        run: sh scripts/fetch_sources.sh

      - name: Independently build and statically audit image
        run: |
          set -euo pipefail
          sh scripts/build_image.sh
          mkdir -p build/reproducibility
          (cd build/output/images && sha256sum usb-cold-wallet.img bzImage) > build/reproducibility/run-${{ matrix.run }}.sha256

      - name: Upload independent build SHA-256 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-usb-clean-hashes-${{ matrix.run }}
          path: build/reproducibility/run-${{ matrix.run }}.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Stage exact image and kernel for boot verification
        if: matrix.run == 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNVERIFIED-live-usb-selected-clean-image
          path: |
            build/output/images/usb-cold-wallet.img
            build/output/images/bzImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify-and-publish:
    # A failed/cancelled/missing clean build prevents any verified artifact.
    if: inputs.smoke_only != true
    needs: clean-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install UEFI verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xz-utils

      - name: Download both independent clean-build digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: live-usb-clean-hashes-*
          merge-multiple: true
          path: build/reproducibility

      - name: Download second clean-build image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: UNVERIFIED-live-usb-selected-clean-image
          path: build/output/images

      - name: Compare two independent SHA-256 manifests and actual image bytes
        run: |
          set -euo pipefail
          test -s build/reproducibility/run-1.sha256
          test -s build/reproducibility/run-2.sha256
          if ! cmp -s build/reproducibility/run-1.sha256 build/reproducibility/run-2.sha256; then
            echo "::error::Independent clean builds produced different image/kernel SHA-256"
            diff -u build/reproducibility/run-1.sha256 build/reproducibility/run-2.sha256 || true
            exit 1
          fi
          (cd build/output/images && sha256sum -c ../../reproducibility/run-2.sha256)

      - name: Boot generated USB image using UEFI OVMF/QEMU (TCG)
        run: sh scripts/verify_uefi_boot.sh

      # Publish only after both clean builds match AND the generated image
      # actually booted through OVMF with the startup security audit passing.
      # No artifact is created on failed/cancelled/incomplete verification.
      - name: Package and verify exact image artifact
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_DIR: build/verified-artifact
          XZ_PARAMS: "--threads=1 --check=crc64 -9e"
        run: |
          set -eu
          image="build/output/images/usb-cold-wallet.img"
          evidence="build/reproducibility"
          mkdir -p "$ARTIFACT_DIR"

          # Bind the published bytes to the second clean build that was boot-audited.
          (
            cd build/output/images
            sha256sum -c ../../reproducibility/run-2.sha256
            sha256sum usb-cold-wallet.img > usb-cold-wallet.img.sha256
            sha256sum -c usb-cold-wallet.img.sha256
          )

          cp "$image" "$ARTIFACT_DIR/usb-cold-wallet.img"
          cp build/output/images/usb-cold-wallet.img.sha256 "$ARTIFACT_DIR/"
          cp "$evidence/run-1.sha256" "$evidence/run-2.sha256" "$ARTIFACT_DIR/"

          # xz does not embed timestamps. Single-threaded fixed parameters make
          # the compressed representation independently reproducible.
          xz $XZ_PARAMS --keep --stdout "$image" > "$ARTIFACT_DIR/usb-cold-wallet.img.xz"
          (
            cd "$ARTIFACT_DIR"
            sha256sum usb-cold-wallet.img.xz > usb-cold-wallet.img.xz.sha256
            sha256sum -c usb-cold-wallet.img.sha256
            sha256sum -c usb-cold-wallet.img.xz.sha256
            xz --test usb-cold-wallet.img.xz
            xz --decompress --stdout usb-cold-wallet.img.xz | cmp - usb-cold-wallet.img
          )

          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          {
            echo "classification=TESTNET ONLY / NOT A RELEASE"
            echo "clean_build_count=2"
            echo "reproducibility_verified=true"
            echo "repository=${{ github.repository }}"
            echo "commit_sha=$actual"
            echo "event_head_sha=$EXPECTED_HEAD_SHA"
            echo "workflow_run_id=${{ github.run_id }}"
            echo "workflow_run_attempt=${{ github.run_attempt }}"
            echo "workflow_ref=${{ github.workflow_ref }}"
            echo "source_date_epoch=$(sed -n 's/^SOURCE_DATE_EPOCH=//p' infra/reproducible.env)"
            echo "xz_version=$(xz --version | head -n1)"
            echo "xz_params=$XZ_PARAMS"
            echo "buildroot_env_sha256=$(sha256sum infra/buildroot.env | awk '{print $1}')"
            echo "reproducible_env_sha256=$(sha256sum infra/reproducible.env | awk '{print $1}')"
            echo "defconfig_sha256=$(sha256sum buildroot-external/configs/usb_wallet_x86_64_defconfig | awk '{print $1}')"
            echo "genimage_cfg_sha256=$(sha256sum buildroot-external/board/usb-wallet/genimage.cfg | awk '{print $1}')"
            echo "image_sha256=$(sha256sum "$image" | awk '{print $1}')"
            echo "compressed_image_sha256=$(sha256sum "$ARTIFACT_DIR/usb-cold-wallet.img.xz" | awk '{print $1}')"
          } > "$ARTIFACT_DIR/ARTIFACT-MANIFEST.txt"

          # Manifest and evidence must all describe the exact same raw image.
          expected="$(awk '$2 == "usb-cold-wallet.img" {print $1}' "$evidence/run-2.sha256")"
          test -n "$expected"
          test "$expected" = "$(awk '{print $1}' "$ARTIFACT_DIR/usb-cold-wallet.img.sha256")"
          test "$expected" = "$(sed -n 's/^image_sha256=//p' "$ARTIFACT_DIR/ARTIFACT-MANIFEST.txt")"

      - name: Upload verified testnet-only boot image (NOT A RELEASE)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: testnet-only-NOT-A-RELEASE-usb-cold-wallet
          path: build/verified-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload bounded UEFI failure diagnostics (test image only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-usb-uefi-failure
          path: build/reproducibility/uefi-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload SHA-256 evidence (no wallet secrets or images)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-usb-build-hashes
          path: build/reproducibility/*.sha256
          if-no-files-found: ignore
          retention-days: 7
