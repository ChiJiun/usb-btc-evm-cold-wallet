name: Live USB image verification

on:
  pull_request:
    paths:
      - ".github/workflows/live-usb-build.yml"
      - "buildroot-external/**"
      - "infra/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-usb-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      DEBIAN_FRONTEND: noninteractive
      BR2_JLEVEL: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Test exact PR HEAD, not GitHub's synthetic pull-request merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show resource budget
        run: |
          uname -m
          nproc
          free -h
          df -h .

      - name: Install build-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make gcc g++ patch rsync perl tar cpio file bc gawk gzip \
            bzip2 xz-utils python3 python3-venv python3-pip curl wget gnupg \
            coreutils findutils diffutils unzip ca-certificates qemu-system-x86 ovmf

      - name: Verify host prerequisites
        run: |
          sh scripts/check_host.sh
          df -h .

      - name: Prepare authenticated offline sources
        run: sh scripts/fetch_sources.sh

      - name: Build image and verify reproducibility (two clean builds)
        run: sh scripts/check_reproducible.sh

      - name: Boot generated USB image using UEFI OVMF/QEMU (TCG)
        run: sh scripts/verify_uefi_boot.sh

      - name: Upload bounded UEFI failure diagnostics (test image only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-usb-uefi-failure
          path: build/reproducibility/uefi-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      # This step is reached only after BOTH clean builds matched and the
      # resulting image passed the real OVMF/QEMU startup security audit.
      # Recheck the exact bytes that are about to be distributed.
      - name: Stage verified testnet image and SHA-256 (NOT A RELEASE)
        if: success()
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          src=build/output/images
          stage=build/verified-testnet-image
          test -s "$src/usb-cold-wallet.img"
          test -s "$src/usb-cold-wallet.img.sha256"
          (cd "$src" && sha256sum --check --status usb-cold-wallet.img.sha256)
          mkdir -p "$stage"
          cp "$src/usb-cold-wallet.img" "$stage/usb-cold-wallet.img"
          cp "$src/usb-cold-wallet.img.sha256" "$stage/usb-cold-wallet.img.sha256"
          (cd "$stage" && sha256sum --check --status usb-cold-wallet.img.sha256)
          cat > "$stage/TESTNET-ONLY-NOT-A-RELEASE.txt" <<EOF
          TESTNET ONLY / NOT A RELEASE
          Source commit: ${SOURCE_COMMIT}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Requires successful full reproducibility and UEFI/QEMU audit plus separate physical acceptance (#43/#66).
          Never use mainnet assets or real secrets.
          EOF

      - name: Upload verified testnet-only flashable image (NOT A RELEASE)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TESTNET-ONLY-NOT-A-RELEASE-usb-cold-wallet-image
          path: build/verified-testnet-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload SHA-256 evidence (no wallet secrets or images)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-usb-build-hashes
          path: build/reproducibility/*.sha256
          if-no-files-found: ignore
          retention-days: 7
