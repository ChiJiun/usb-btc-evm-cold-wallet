name: Live USB image verification

on:
  push:
    branches:
      - feat/issue-1-reproducible-live-usb
  pull_request:
    paths:
      - ".github/workflows/live-usb-build.yml"
      - "buildroot-external/**"
      - "infra/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-usb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      DEBIAN_FRONTEND: noninteractive
      BR2_JLEVEL: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Show resource budget
        run: |
          uname -m
          nproc
          free -h
          df -h .

      - name: Install build-host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make gcc g++ patch rsync perl tar cpio file bc gawk gzip \
            bzip2 xz-utils python3 python3-venv python3-pip curl wget gnupg \
            coreutils findutils diffutils unzip ca-certificates

      - name: Verify host prerequisites
        run: |
          sh scripts/check_host.sh
          df -h .

      - name: Prepare authenticated offline sources
        run: sh scripts/fetch_sources.sh

      - name: Build image and verify reproducibility (two clean builds)
        run: sh scripts/check_reproducible.sh

      - name: Upload SHA-256 evidence (no wallet secrets or images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-usb-build-hashes
          path: build/reproducibility/*.sha256
          if-no-files-found: ignore
          retention-days: 7
