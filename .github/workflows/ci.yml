name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test CLI
        run: usb-cold-wallet --help

  qr_transport:
    name: QR transport / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Detect QR transport
        id: qr
        run: |
          if test -f qr-transport/package-lock.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 24
        if: steps.qr.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qr-transport/package-lock.json

      - name: QR unit tests, offline build, and dependency audit
        if: steps.qr.outputs.present == 'true'
        working-directory: qr-transport
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Audit locked dependency set
        run: python -m pip_audit -r requirements/ci.lock --require-hashes

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Detect Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/sbom.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/sbom")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Dependency Graph is not enabled; dependency-review is skipped. Hash locking and pip-audit remain required."
              ;;
            *)
              echo "Unexpected Dependency Graph API status: $status" >&2
              cat /tmp/sbom.json >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  reproducible_build:
    name: Reproducible wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Build twice from clean source snapshots
        env:
          SOURCE_DATE_EPOCH: "315532800"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-a /tmp/source-b /tmp/dist-a /tmp/dist-b
          git archive HEAD | tar -x -C /tmp/source-a
          git archive HEAD | tar -x -C /tmp/source-b
          python -m build --no-isolation --wheel --outdir /tmp/dist-a /tmp/source-a
          python -m build --no-isolation --wheel --outdir /tmp/dist-b /tmp/source-b
          sha256sum /tmp/dist-a/*.whl
          sha256sum /tmp/dist-b/*.whl
          test "$(sha256sum /tmp/dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum /tmp/dist-b/*.whl | cut -d' ' -f1)"

  required:
    name: CI / Required
    if: always()
    needs:
      - tests
      - qr_transport
      - dependency_audit
      - secret_scan
      - dependency_review
      - reproducible_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all security and test jobs
        env:
          TESTS: ${{ needs.tests.result }}
          QR_TRANSPORT: ${{ needs.qr_transport.result }}
          AUDIT: ${{ needs.dependency_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          REPRODUCIBLE_BUILD: ${{ needs.reproducible_build.result }}
        run: |
          set -euo pipefail
          test "$TESTS" = "success"
          test "$QR_TRANSPORT" = "success"
          test "$AUDIT" = "success"
          test "$SECRET_SCAN" = "success"
          test "$REPRODUCIBLE_BUILD" = "success"
          if [ "$DEPENDENCY_REVIEW" != "success" ] && [ "$DEPENDENCY_REVIEW" != "skipped" ]; then
            echo "dependency-review result: $DEPENDENCY_REVIEW" >&2
            exit 1
          fi
