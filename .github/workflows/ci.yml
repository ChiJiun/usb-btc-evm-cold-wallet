name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Run on every PR so CI / Required is always reported.
  # Skip expensive jobs for documentation-only changes, not the status check.
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      deps: ${{ steps.scope.outputs.deps }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select required checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=false
          deps=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual dispatch is intentionally a full validation.
            code=true
            deps=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$PR_BASE_SHA"
            else
              base="$PUSH_BEFORE_SHA"
            fi

            if [[ -z "$base" ]] || [[ "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning::Missing comparison commit; running full validation"
              code=true
              deps=true
            else
              git diff --name-only -z "$base" HEAD > "$RUNNER_TEMP/ci-changed-files"

              if [[ ! -s "$RUNNER_TEMP/ci-changed-files" ]]; then
                echo "::warning::Empty changed-file list; running full validation"
                code=true
                deps=true
              else
                while IFS= read -r -d '' file; do
                  echo "Changed: $file"
                  case "$file" in
                    README|README.*|docs/*|LICENSE|LICENSE.*|NOTICE|NOTICE.*|CHANGELOG*|CONTRIBUTING*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*)
                      ;;
                    *)
                      code=true
                      ;;
                  esac

                  case "$file" in
                    requirements/*|pyproject.toml|setup.py|setup.cfg|Pipfile*|poetry.lock|uv.lock|infra/wheelhouse*|.github/workflows/ci.yml)
                      deps=true
                      ;;
                  esac
                done < "$RUNNER_TEMP/ci-changed-files"
              fi
            fi
          fi

          {
            echo "code=$code"
            echo "deps=$deps"
          } >> "$GITHUB_OUTPUT"
          echo "Code / wheel checks: $code; dependency checks: $deps; secret scanning: always"

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test CLI
        run: usb-cold-wallet --help

  dependency_audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Audit locked dependency set
        run: python -m pip_audit -r requirements/ci.lock --require-hashes

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_review:
    needs: changes
    name: Dependency review
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Detect Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/sbom.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/sbom")"
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Dependency Graph is not enabled; dependency-review is skipped. Hash locking and pip-audit remain required."
              ;;
            *)
              echo "Unexpected Dependency Graph API status: $status" >&2
              cat /tmp/sbom.json >&2
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  reproducible_build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Reproducible wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Build twice from clean source snapshots
        env:
          SOURCE_DATE_EPOCH: "315532800"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-a /tmp/source-b /tmp/dist-a /tmp/dist-b
          git archive HEAD | tar -x -C /tmp/source-a
          git archive HEAD | tar -x -C /tmp/source-b
          python -m build --no-isolation --wheel --outdir /tmp/dist-a /tmp/source-a
          python -m build --no-isolation --wheel --outdir /tmp/dist-b /tmp/source-b
          sha256sum /tmp/dist-a/*.whl
          sha256sum /tmp/dist-b/*.whl
          test "$(sha256sum /tmp/dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum /tmp/dist-b/*.whl | cut -d' ' -f1)"

  required:
    name: CI / Required
    if: always()
    needs:
      - changes
      - tests
      - dependency_audit
      - secret_scan
      - dependency_review
      - reproducible_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every scheduled test and security check
        env:
          SCOPE: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DEPS: ${{ needs.changes.outputs.deps }}
          EVENT_NAME: ${{ github.event_name }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.dependency_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          REPRODUCIBLE_BUILD: ${{ needs.reproducible_build.result }}
        run: |
          set -euo pipefail
          test "$SCOPE" = "success"
          test "$SECRET_SCAN" = "success"

          if [[ "$CODE" == "true" ]]; then
            test "$TESTS" = "success"
            test "$REPRODUCIBLE_BUILD" = "success"
          else
            test "$CODE" = "false"
            test "$TESTS" = "skipped"
            test "$REPRODUCIBLE_BUILD" = "skipped"
          fi

          if [[ "$DEPS" == "true" ]]; then
            test "$AUDIT" = "success"
          else
            test "$DEPS" = "false"
            test "$AUDIT" = "skipped"
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$DEPS" == "true" ]]; then
            test "$DEPENDENCY_REVIEW" = "success"
          else
            test "$DEPENDENCY_REVIEW" = "skipped"
          fi
