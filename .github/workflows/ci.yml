name: CI

on:
  push:
    branches: [main]
  # Default PR activity only. Draft and Ready run the identical gate, so
  # marking a draft Ready must not repeat a ~40 min image build on the same SHA.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # Scheduled workflows run from the default branch even when no files change.
  schedule:
    - cron: "20 2 * * *"

permissions:
  contents: read

concurrency:
  # Only supersede older runs of the same pull request. Push/schedule/manual
  # runs use their unique run id so a later merge to main cannot cancel an
  # earlier main validation and create a false Required failure.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Run on every PR so CI / Required is always reported.
  # Skip expensive jobs for documentation-only changes, not the status check.
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
      deps: ${{ steps.scope.outputs.deps }}
      metadata: ${{ steps.scope.outputs.metadata }}
      node: ${{ steps.scope.outputs.node }}
      snap: ${{ steps.scope.outputs.snap }}
      qr: ${{ steps.scope.outputs.qr }}
      native_qr: ${{ steps.scope.outputs.native_qr }}
      windows: ${{ steps.scope.outputs.windows }}
      live_usb: ${{ steps.scope.outputs.live_usb }}
      live_usb_smoke: ${{ steps.scope.outputs.live_usb_smoke }}
      btc_core: ${{ steps.scope.outputs.btc_core }}
      btc_fuzz: ${{ steps.scope.outputs.btc_fuzz }}
      vfat: ${{ steps.scope.outputs.vfat }}
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select required checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci_checks.py scope

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test CLI
        run: usb-cold-wallet --help

  qr_transport:
    needs: changes
    if: needs.changes.outputs.qr == 'true'
    name: QR transport / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require QR transport manifest and lockfile
        run: |
          set -euo pipefail
          test -f qr-transport/package.json
          test -f qr-transport/package-lock.json

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qr-transport/package-lock.json

      - name: QR unit tests, offline build, and dependency audit
        working-directory: qr-transport
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Test watch-only Companion browser interactions and guardrails
        run: node --check src/usb_cold_wallet/companion_static/companion.js && node --test tests/test_companion_ui.mjs

      - name: Set up Python for Python-to-QR interoperability vectors
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify Python signed transaction survives browser UR without integer rounding
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          QR_INTEROP=1 python -m pytest -q tests/test_qr_interop.py

  metamask_native_qr:
    needs: changes
    if: needs.changes.outputs.native_qr == 'true'
    name: MetaMask native QR / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require native MetaMask QR app files (fail closed)
        run: |
          set -euo pipefail
          test -f qr-metamask/package.json
          test -f qr-metamask/package-lock.json

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qr-metamask/package-lock.json

      - name: Set up Python for cross-language signing test
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Python and Node dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm ci --prefix qr-metamask --ignore-scripts --no-audit --no-fund

      - name: Verify Python public account export
        run: python -m pytest -q tests/test_keystone_public.py

      - name: Test real MetaMask QR Keyring and Python-signed transactions
        working-directory: qr-metamask
        env:
          PYTHON_BIN: python
        run: |
          npm test
          npm run test:python

      - name: Build offline browser bundle
        run: npm run build --prefix qr-metamask

      - name: Test production browser bundle under its CSP
        working-directory: qr-metamask
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:browser

      - name: Audit native QR runtime dependencies
        run: npm audit --prefix qr-metamask --omit=dev --audit-level=high

  metamask_snap:
    needs: changes
    if: needs.changes.outputs.snap == 'true'
    name: MetaMask Snap / Required
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: metamask-snap
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: metamask-snap/package-lock.json

      - name: Setup Python for true Snap-to-offline GUI interoperability
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Python offline signer and exact Snap dependencies
        run: |
          python -m pip install --require-hashes -r ../requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e ..
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify keyring and adversarial protocol
        run: npm run check

      - name: Verify Python offline GUI bridge to Snap and signed response
        run: npm run test:python

      - name: Build SES bundle and ensure committed manifest digest matches
        run: |
          npm run build
          git diff --exit-code -- snap.manifest.json

      - name: Build real Companion bundle
        run: npm run build:companion

      - name: Test Chromium production Companion
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:browser

      - name: Audit Snap production and developer dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

  dependency_audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Audit locked dependency set
        run: python -m pip_audit -r requirements/ci.lock --require-hashes

  node_audit:
    name: Node production dependency audit
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Audit every checked-in Node application
        shell: bash
        run: |
          set -euo pipefail
          found=false
          # A trusted checkout contains only repository files. Never execute
          # package lifecycle scripts: dependency audits do not require them.
          while IFS= read -r -d '' manifest; do
            found=true
            dir="${manifest%/package.json}"
            if [[ "$dir" == "$manifest" ]]; then dir="."; fi
            if [[ ! -f "$dir/package-lock.json" && ! -f "$dir/npm-shrinkwrap.json" ]]; then
              echo "::error::Missing npm lockfile for $manifest; supported Node CI requires npm lockfiles"
              exit 1
            fi
            echo "Auditing Node production dependencies: $dir"
            npm ci --prefix "$dir" --ignore-scripts --omit=dev --no-fund --no-audit
            npm audit --prefix "$dir" --omit=dev --audit-level=high
            # Daily schedule skips the QR build job. Also audit dev/build
            # dependencies from the complete lockfile (e.g. Vite).
            echo "Auditing Node build and development dependencies: $dir"
            npm audit --prefix "$dir" --audit-level=high
          done < <(git ls-files -z -- 'package.json' '*/package.json')

          if [[ "$found" != true ]]; then
            echo "No tracked Node manifests yet; nothing to audit."
          fi

  # The Windows EXE is part of the wallet's core user experience and must
  # never be optional for code changes. Call a pinned local reusable workflow
  # so the result is available to the SAME CI / Required graph.
  windows_portable:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/windows-companion.yml

  # Called from the same required job graph. An unrelated PR skips the
  # heavyweight image build, but an expected failure/missing run blocks merge.
  live_usb_smoke:
    needs: changes
    if: needs.changes.outputs.live_usb_smoke == 'true'
    uses: ./.github/workflows/live-usb-build.yml
    with:
      smoke_only: true

  live_usb:
    # Do not spend ~75 runner-minutes building images after fast Python
    # validation fails. Draft, Ready, main and manual runs use the same full
    # dual clean-build gate; a failed/skipped prerequisite fails CI / Required.
    needs: [changes, tests]
    if: needs.changes.outputs.live_usb == 'true' && needs.tests.result == 'success'
    uses: ./.github/workflows/live-usb-build.yml

  btc_core:
    needs: changes
    if: needs.changes.outputs.btc_core == 'true'
    uses: ./.github/workflows/btc-core-e2e.yml

  btc_fuzz:
    needs: changes
    if: needs.changes.outputs.btc_fuzz == 'true'
    uses: ./.github/workflows/btc-psbt-fuzz.yml

  vfat:
    needs: changes
    if: needs.changes.outputs.vfat == 'true'
    uses: ./.github/workflows/usb-vfat-atomic.yml

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_review:
    needs: changes
    name: Dependency review
    if: github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Dependency Review uses dependency-graph/compare; a failure must
      # fail this job and the downstream Required gate.
      - name: Review dependency changes (required)
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.0
        with:
          fail-on-severity: moderate

  wheel_smoke:
    name: README wheel metadata smoke
    needs: changes
    if: needs.changes.outputs.metadata == 'true' && needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Build wheel once and verify included README metadata
        run: |
          set -euo pipefail
          python -m build --no-isolation --wheel --outdir /tmp/ci-readme-wheel .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("/tmp/ci-readme-wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              metadata_files = [p for p in wheel.namelist() if p.endswith(".dist-info/METADATA")]
              assert len(metadata_files) == 1, metadata_files
              metadata = wheel.read(metadata_files[0]).decode("utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          assert readme.strip() in metadata, "Wheel METADATA is missing README.md content"
          print("README.md is embedded in the built wheel metadata")
          PY

  reproducible_build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Reproducible wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Build twice from clean source snapshots
        env:
          SOURCE_DATE_EPOCH: "315532800"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-a /tmp/source-b /tmp/dist-a /tmp/dist-b
          git archive HEAD | tar -x -C /tmp/source-a
          git archive HEAD | tar -x -C /tmp/source-b
          python -m build --no-isolation --wheel --outdir /tmp/dist-a /tmp/source-a
          python -m build --no-isolation --wheel --outdir /tmp/dist-b /tmp/source-b
          sha256sum /tmp/dist-a/*.whl
          sha256sum /tmp/dist-b/*.whl
          test "$(sha256sum /tmp/dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum /tmp/dist-b/*.whl | cut -d' ' -f1)"

  required:
    name: CI / Required
    # Keep the aggregate gate fail-closed. Manual/unexpected cancellation of
    # an active run must still surface cancelled dependencies as a failure.
    if: always()
    needs:
      - changes
      - tests
      - metamask_native_qr
      - metamask_snap
      - windows_portable
      - live_usb
      - live_usb_smoke
      - btc_core
      - btc_fuzz
      - vfat
      - dependency_audit
      - node_audit
      - qr_transport
      - secret_scan
      - dependency_review
      - wheel_smoke
      - reproducible_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require every scheduled test and security check
        env:
          SCOPE: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DEPS: ${{ needs.changes.outputs.deps }}
          NODE: ${{ needs.changes.outputs.node }}
          NODE_AUDIT: ${{ needs.node_audit.result }}
          QR_REQUIRED: ${{ needs.changes.outputs.qr }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native_qr }}
          WINDOWS_REQUIRED: ${{ needs.changes.outputs.windows }}
          LIVE_USB_REQUIRED: ${{ needs.changes.outputs.live_usb }}
          LIVE_USB_SMOKE_REQUIRED: ${{ needs.changes.outputs.live_usb_smoke }}
          LIVE_USB_SMOKE: ${{ needs.live_usb_smoke.result }}
          BTC_CORE_REQUIRED: ${{ needs.changes.outputs.btc_core }}
          BTC_FUZZ_REQUIRED: ${{ needs.changes.outputs.btc_fuzz }}
          VFAT_REQUIRED: ${{ needs.changes.outputs.vfat }}
          LIVE_USB: ${{ needs.live_usb.result }}
          BTC_CORE: ${{ needs.btc_core.result }}
          BTC_FUZZ: ${{ needs.btc_fuzz.result }}
          VFAT: ${{ needs.vfat.result }}
          QR_TRANSPORT: ${{ needs.qr_transport.result }}
          NATIVE_QR: ${{ needs.metamask_native_qr.result }}
          SNAP: ${{ needs.changes.outputs.snap }}
          SNAP_VERIFY: ${{ needs.metamask_snap.result }}
          WINDOWS_PORTABLE: ${{ needs.windows_portable.result }}
          METADATA: ${{ needs.changes.outputs.metadata }}
          EVENT_NAME: ${{ github.event_name }}
          TESTS: ${{ needs.tests.result }}
          AUDIT: ${{ needs.dependency_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          WHEEL_SMOKE: ${{ needs.wheel_smoke.result }}
          REPRODUCIBLE_BUILD: ${{ needs.reproducible_build.result }}
        run: python3 scripts/ci_checks.py required
