name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install project without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test CLI
        run: usb-cold-wallet --help

  qr_transport:
    name: QR transport / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require QR transport manifest and lockfile
        run: |
          set -euo pipefail
          test -f qr-transport/package.json
          test -f qr-transport/package-lock.json

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qr-transport/package-lock.json

      - name: QR unit tests, offline build, and dependency audit
        working-directory: qr-transport
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Set up Python for Python-to-QR interoperability vectors
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify Python signed transaction survives browser UR without integer rounding
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          QR_INTEROP=1 python -m pytest -q tests/test_qr_interop.py

  metamask_native_qr:
    name: MetaMask native QR / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require native MetaMask QR app files (fail closed)
        run: |
          set -euo pipefail
          test -f qr-metamask/package.json
          test -f qr-metamask/package-lock.json

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: qr-metamask/package-lock.json

      - name: Set up Python for cross-language signing test
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned Python and Node dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm ci --prefix qr-metamask --ignore-scripts --no-audit --no-fund

      - name: Verify Python public account export
        run: python -m pytest -q tests/test_keystone_public.py

      - name: Test real MetaMask QR Keyring and Python-signed transactions
        working-directory: qr-metamask
        env:
          PYTHON_BIN: python
        run: |
          npm test
          npm run test:python

      - name: Build offline browser bundle
        run: npm run build --prefix qr-metamask

      - name: Test production browser bundle under its CSP
        working-directory: qr-metamask
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:browser

      - name: Audit native QR runtime dependencies
        run: npm audit --prefix qr-metamask --omit=dev --audit-level=high

  dependency_audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Audit locked dependency set
        run: python -m pip_audit -r requirements/ci.lock --require-hashes

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The action checks the actual dependency-graph/compare endpoint.
      # Do not use a separate SBOM availability probe: 403/404 must fail
      # the review rather than turning this required job into a success.
      - name: Review dependency changes (required)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate

  reproducible_build:
    name: Reproducible wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Build twice from clean source snapshots
        env:
          SOURCE_DATE_EPOCH: "315532800"
          PYTHONHASHSEED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-a /tmp/source-b /tmp/dist-a /tmp/dist-b
          git archive HEAD | tar -x -C /tmp/source-a
          git archive HEAD | tar -x -C /tmp/source-b
          python -m build --no-isolation --wheel --outdir /tmp/dist-a /tmp/source-a
          python -m build --no-isolation --wheel --outdir /tmp/dist-b /tmp/source-b
          sha256sum /tmp/dist-a/*.whl
          sha256sum /tmp/dist-b/*.whl
          test "$(sha256sum /tmp/dist-a/*.whl | cut -d' ' -f1)" = "$(sha256sum /tmp/dist-b/*.whl | cut -d' ' -f1)"

  required:
    name: CI / Required
    if: always()
    needs:
      - tests
      - qr_transport
      - metamask_native_qr
      - dependency_audit
      - secret_scan
      - dependency_review
      - reproducible_build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all security and test jobs
        env:
          TESTS: ${{ needs.tests.result }}
          QR_TRANSPORT: ${{ needs.qr_transport.result }}
          NATIVE_QR: ${{ needs.metamask_native_qr.result }}
          AUDIT: ${{ needs.dependency_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          EVENT_NAME: ${{ github.event_name }}
          REPRODUCIBLE_BUILD: ${{ needs.reproducible_build.result }}
        run: |
          set -euo pipefail
          test "$TESTS" = "success"
          test "$QR_TRANSPORT" = "success"
          test "$NATIVE_QR" = "success"
          test "$AUDIT" = "success"
          test "$SECRET_SCAN" = "success"
          test "$REPRODUCIBLE_BUILD" = "success"
          # A PR must actually execute Dependency Review. A skipped job is
          # acceptable only for events where this PR-only job is intentionally
          # not scheduled (push/workflow_dispatch).
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$DEPENDENCY_REVIEW" = "success"
          else
            test "$DEPENDENCY_REVIEW" = "skipped"
          fi
