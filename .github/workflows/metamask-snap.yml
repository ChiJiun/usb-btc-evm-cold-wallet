name: MetaMask Snap POC

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap_verify:
    name: MetaMask Snap / Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: metamask-snap
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: metamask-snap/package-lock.json

      - name: Set up Python 3.12 for real offline GUI interoperability
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install exact Python/Node dependencies without npm scripts
        run: |
          python -m pip install --require-hashes -r ../requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation -e ..
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check, keyring and adversarial tests
        run: npm run check

      - name: Test actual Python offline GUI to Snap protocol
        run: npm run test:python

      - name: Build Snap SES bundle
        run: npm run build

      - name: Reject stale committed Snap manifest bundle digest
        run: git diff --exit-code -- snap.manifest.json

      - name: Build browser Companion
        run: npm run build:companion

      - name: Install Chromium for production Companion browser tests
        run: npx playwright install --with-deps --only-shell chromium

      - name: Test downloaded QR integrity and fail-closed browser UX
        run: npm run test:browser

      - name: Reject high/critical runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high
