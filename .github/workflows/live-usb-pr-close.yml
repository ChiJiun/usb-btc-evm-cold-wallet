name: Cancel obsolete Live USB checks

# Use the base repository's trusted workflow on PR close; do not check out
# or execute code from the untrusted PR. This workflow becomes active once
# merged into the default branch.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel-live-usb:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel unfinished Live USB PR builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # GitHub may clear run.pull_requests after its PR closes. Verify a
          # unique originating PR through the trusted, paginated REST pulls
          # list before accepting a run with no PR association. Never infer
          # identity from the branch alone, even when names match.
          unique_owner_filter='
            [ .[][]?
              | select(.head.sha == $sha)
              | select(.head.ref == $branch)
              | select(.head.repo.full_name == $source)
              | .number
            ] | unique
            | if length == 1 then (.[0] | tostring) else "" end
          '
          unique_owner=""
          if [[ "$PR_SOURCE_REPO" == */* && "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            source_owner="${PR_SOURCE_REPO%%/*}"
            if identified="$(
              gh api --paginate --method GET \
                -f state=all \
                -f head="${source_owner}:${PR_BRANCH}" \
                -f per_page=100 \
                "repos/${REPOSITORY}/pulls" \
                | jq -sr \
                  --arg branch "$PR_BRANCH" \
                  --arg source "$PR_SOURCE_REPO" \
                  --arg sha "$PR_HEAD_SHA" \
                  "$unique_owner_filter"
            )"; then
              unique_owner="$identified"
            else
              echo "::warning::Cannot establish unique PR identity; empty-association runs are not cancelled"
            fi
          fi

          # An explicit, sole PR association wins. If GitHub has already
          # cleared that array, require *both* a unique GitHub pull record
          # and an exact head SHA. Ambiguous associations fail closed.
          filter='
            .workflow_runs[]?
            | select(.event == "pull_request")
            | select(.name == "Live USB image verification" or .name == "Live USB fast boot diagnostics")
            | select(.head_branch == $branch)
            | select(.head_repository.full_name == $source)
            | select(
                (((.pull_requests // []) | length) == 1 and
                  any(.pull_requests[]?; .number == $number))
                or
                (((.pull_requests // []) | length) == 0 and
                  $unique_owner == ($number | tostring) and
                  .head_sha == $sha)
              )
            | .id
          '

          # Automatic PR checks only. Leave explicitly dispatched manual
          # diagnostics untouched. New commits are already handled by each
          # workflow's cancel-in-progress concurrency setting.
          for status in queued in_progress requested waiting pending; do
            ids="$(
              gh api --paginate --method GET \
                -f event=pull_request \
                -f status="$status" \
                -f branch="$PR_BRANCH" \
                -f per_page=100 \
                "repos/${REPOSITORY}/actions/runs" \
                | jq -r \
                  --arg branch "$PR_BRANCH" \
                  --arg source "$PR_SOURCE_REPO" \
                  --argjson number "$PR_NUMBER" \
                  --arg unique_owner "$unique_owner" \
                  --arg sha "$PR_HEAD_SHA" \
                  "$filter"
            )"

            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
                echo "Unexpected workflow run ID: $run_id" >&2
                exit 1
              fi
              echo "Cancelling obsolete Live USB run $run_id for closed PR #$PR_NUMBER"
              gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/cancel"
            done <<< "$ids"
          done
