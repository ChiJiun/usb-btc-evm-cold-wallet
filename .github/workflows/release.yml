name: Release provenance candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed annotated vMAJOR.MINOR.PATCH tag"
        required: true
        type: string
      source_sha:
        description: "Exact lowercase 40-hex commit targeted by the signed tag"
        required: true
        type: string
      publish:
        description: "Publish verified bytes after all gates; keep false until #24 and #43 pass"
        required: true
        default: false
        type: boolean

# No ambient token privileges. Every job declares only what it needs.
permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.3"
  XZ_FLAGS: "-6 --threads=1 --check=crc64 --no-sparse"

jobs:
  validate:
    name: Validate signed release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Refuse non-main workflow dispatches
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Check out trusted release verifier from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Require exact signed tag to source SHA binding
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo "::error::source_sha must be lowercase hex"; exit 1 ;;
          esac
          test "${#SOURCE_SHA}" -eq 40
          python3 scripts/verify_release_assets.py             --tag "$TAG" --commit "$SOURCE_SHA" --source-only

  build:
    name: Build reproducible final bytes
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
      BR2_JLEVEL: "2"
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ASSET: usb-cold-wallet-${{ inputs.tag }}.img.xz
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checkout is the exact requested commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up exact Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Verify every tracked Node lockfile with exact Node
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$NODE_VERSION"
          found=false
          while IFS= read -r -d '' manifest; do
            found=true
            dir="${manifest%/package.json}"
            if [[ "$dir" == "$manifest" ]]; then dir="."; fi
            test -f "$dir/package-lock.json"
            npm ci --prefix "$dir" --ignore-scripts --no-audit --no-fund
            rm -rf -- "$dir/node_modules"
          done < <(git ls-files -z -- 'package.json' '*/package.json')
          test "$found" = true
          test -z "$(git status --porcelain)"

      - name: Install fixed release host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential make gcc g++ patch rsync perl tar cpio file bc gawk gzip             bzip2 xz-utils python3 python3-venv python3-pip curl wget gnupg             coreutils findutils diffutils unzip ca-certificates qemu-system-x86 ovmf

      - name: Verify host and authenticated pinned sources
        run: |
          set -euo pipefail
          sh scripts/check_host.sh
          sh scripts/fetch_sources.sh

      - name: Two clean image builds and raw SHA-256 comparison
        run: sh scripts/check_reproducible.sh

      - name: Boot final raw image through UEFI security audit
        run: sh scripts/verify_uefi_boot.sh

      - name: Build and verify the Buildroot-pinned xz compressor
        id: xz
        run: |
          set -euo pipefail
          BR="$(sh scripts/fetch_buildroot.sh)"
          OUT="$GITHUB_WORKSPACE/build/output"
          BR2_DL_DIR="$GITHUB_WORKSPACE/build/dl"             make -C "$BR" O="$OUT" BR2_EXTERNAL="$GITHUB_WORKSPACE/buildroot-external" host-xz
          expected="$(awk '$1 == "XZ_VERSION" && $2 == "=" {print $3; exit}' "$BR/package/xz/xz.mk")"
          actual="$("$OUT/host/bin/xz" --version | awk 'NR == 1 {print $NF}')"
          test -n "$expected"
          test "$actual" = "$expected"
          echo "version=$actual" >> "$GITHUB_OUTPUT"

      - name: Reconfirm raw image digest and compress final bytes twice
        run: |
          set -euo pipefail
          RAW="build/output/images/usb-cold-wallet.img"
          RUN2="$(awk '$2 == "usb-cold-wallet.img" {print $1}' build/reproducibility/run-2.sha256)"
          test -n "$RUN2"
          test "$(sha256sum "$RAW" | awk '{print $1}')" = "$RUN2"

          mkdir -p release
          XZ="build/output/host/bin/xz"
          "$XZ" $XZ_FLAGS -c "$RAW" > "release/$ASSET"
          "$XZ" $XZ_FLAGS -c "$RAW" > "release/.second.img.xz"
          cmp -s "release/$ASSET" "release/.second.img.xz"
          rm "release/.second.img.xz"

      - name: Generate SPDX JSON SBOM from the final root filesystem
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: build/output/target
          format: spdx-json
          output-file: release/SBOM.spdx.json
          syft-version: v1.54.0
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Write release metadata and checksum only final publish bytes
        env:
          XZ_VERSION: ${{ steps.xz.outputs.version }}
        run: |
          set -euo pipefail
          . infra/buildroot.env
          export BUILDROOT_VERSION BUILDROOT_SHA256 NODE_VERSION XZ_VERSION
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "tag": os.environ["TAG"],
              "source_sha": os.environ["SOURCE_SHA"],
              "workflow": ".github/workflows/release.yml",
              "asset": os.environ["ASSET"],
              "buildroot_version": os.environ["BUILDROOT_VERSION"],
              "buildroot_sha256": os.environ["BUILDROOT_SHA256"],
              "node_version": os.environ["NODE_VERSION"],
              "xz_version": os.environ["XZ_VERSION"],
              "compression": "xz -6 --threads=1 --check=crc64 --no-sparse",
          }
          Path("release/release-metadata.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd release
            sha256sum "$ASSET" SBOM.spdx.json release-metadata.json | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload immutable candidate bytes for downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest exact final bytes
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ASSET: usb-cold-wallet-${{ inputs.tag }}.img.xz
    steps:
      - name: Download exact candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release

      - name: Recheck candidate bytes before attestation
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)

      - name: Create SLSA build provenance for checksum subjects
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create build provenance for the checksum manifest itself
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS

      - name: Attach SBOM attestation to the final compressed image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ env.ASSET }}
          sbom-path: release/SBOM.spdx.json

  verify:
    name: Verify attested candidate before publish
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      ASSET: usb-cold-wallet-${{ inputs.tag }}.img.xz
    steps:
      - name: Check out trusted verifier from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download the already-attested candidate bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release

      - name: Verify repo, tag, source, workflow, subject digest, and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_assets.py             --tag "$TAG" --commit "$SOURCE_SHA" --asset "$ASSET" --local-dir release

  gate:
    name: Required release gate
    if: always()
    needs:
      - build
      - attest
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted gate logic from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Fail closed on failed, cancelled, or skipped required jobs
        env:
          BUILD: ${{ needs.build.result }}
          ATTEST: ${{ needs.attest.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.verify_release_assets import require_successful_jobs

          require_successful_jobs(
              {
                  "build": os.environ["BUILD"],
                  "attest": os.environ["ATTEST"],
                  "verify": os.environ["VERIFY"],
              }
          )
          PY

  publish:
    name: Publish previously verified bytes
    needs: gate
    if: inputs.publish && github.ref == 'refs/heads/main' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ASSET: usb-cold-wallet-${{ inputs.tag }}.img.xz
    steps:
      - name: Require hardware and product release gates to be closed
        run: |
          set -euo pipefail
          for issue in 24 43; do
            state="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
            if [[ "$state" != "CLOSED" ]]; then
              echo "::error::Issue #$issue is still $state; production release remains blocked"
              exit 1
            fi
          done

      - name: Refuse replacement of an existing Release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; assets are never overwritten"
            exit 1
          fi

      - name: Download only the verified candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.tag }}-${{ inputs.source_sha }}
          path: release

      - name: Recheck final bytes without rebuilding or recompressing
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)

      - name: Publish the exact verified bytes
        run: |
          set -euo pipefail
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease) ;; esac
          gh release create "$TAG"             "release/$ASSET"             release/SHA256SUMS             release/SBOM.spdx.json             release/release-metadata.json             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "$TAG"             --notes "Release provenance candidate. Do not claim production safety without the #24/#43 acceptance evidence."             "${extra[@]}"
