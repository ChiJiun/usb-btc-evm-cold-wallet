<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cold Wallet QR Air-Gap Transport (TESTNET ONLY)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
</head>
<body>
  <main>
    <h1>Air-Gap QR 資料交換 <small>TESTNET / SEPOLIA</small></h1>
    <p class="warning">僅交換資料，QR 並非交易授權。禁止輸入助記詞、私鑰或 vault。真正的交易批准必須在離線主機另行審核。</p>
    <section>
      <h2>輸出 QR（由電腦螢幕傳給另一台電腦）</h2>
      <label>選取 JSON 交易交換資料（限 150 KB）<input id="inputFile" type="file" accept=".json,application/json"/></label>
      <button id="prepare">載入並顯示 QR</button>
      <div id="frameLabel" aria-live="polite"></div>
      <canvas id="qrCanvas" aria-label="本機 QR 顯示"></canvas>
      <div><button id="stopAnimation">暫停動畫</button><button id="resumeAnimation">繼續動畫</button></div>
    </section>
    <section>
      <h2>掃描 QR（本機攝影機，禁止虛擬鍵盤橋接）</h2>
      <p>攝影機只在目前裝置上存取，不會將影片上傳。需 HTTPS 或 localhost 安全來源。</p>
      <div><button id="startScan">啟動攝影機</button><button id="stopScan">停止攝影機</button><button id="resetScan">重新掃描</button></div>
      <video id="preview" muted autoplay playsinline></video>
      <label for="progress">掃描進度</label><progress id="progress" max="100" value="0"></progress>
      <span id="progressLabel">0%</span>
      <button id="save" disabled>下載已還原交換資料（只做資料傳輸，不簽署）</button>
    </section>
    <section>
      <h2>USB-B 備援</h2>
      <p>若攝影機不可用，使用 <code>usb-cold-wallet pack-request</code> 與 <code>--request</code> 的完整性檢查交換流程，仍須獨立檢查收款地址與金額。</p>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="/src/web.mjs"></script>
</body>
</html>
